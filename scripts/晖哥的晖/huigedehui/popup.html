<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 320px;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
        }
        h3 {
            font-size: 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .status-item {
            display: flex;
            justify-content: space-between;
            margin: 6px 0;
            font-size: 13px;
        }
        .status-value { color: #667eea; font-weight: 600; }
        .exam-type { color: #f0ad4e; }
        .btn-group { display: flex; gap: 8px; margin-bottom: 12px; }
        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(102,126,234,0.4); }
        .btn-stop { background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%); color: white; }
        .info { font-size: 11px; opacity: 0.6; text-align: center; margin-top: 8px; }
        .info .key { background: rgba(255,255,255,0.15); padding: 2px 6px; border-radius: 4px; margin: 0 2px; }
        .footer { font-size: 10px; opacity: 0.4; text-align: center; margin-top: 12px; }
    </style>
</head>
<body>
    <h3>🎓 智能考试助手</h3>
    
    <div class="status">
        <div class="status-item">
            <span>考试类型:</span>
            <span id="exam-type" class="status-value exam-type">-</span>
        </div>
        <div class="status-item">
            <span>状  态:</span>
            <span id="status" class="status-value">待机</span>
        </div>
        <div class="status-item">
            <span>题  目:</span>
            <span id="count" class="status-value">0</span>
        </div>
    </div>
    
    <div class="btn-group">
        <button id="btn-fetch" class="btn-primary">获取源码</button>
        <button id="btn-start" class="btn-primary" disabled>开始答题</button>
        <button id="btn-stop" class="btn-stop" disabled>停止</button>
    </div>
    
    <div class="info">
        快捷键: <span class="key">-</span> 获取 | <span class="key">+</span> 开始 | <span class="key">*</span> 隐藏
    </div>
    
    <div class="footer">v1.0 - 晖哥的晖</div>
    
    <script src="popup.js"></script>
</body>
</html>
