<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晖哥的助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 220px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 13px;
        }

        .header {
            padding: 14px 16px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header .icon {
            font-size: 20px;
        }

        .header .title {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }

        .header .version {
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            margin-left: auto;
        }

        /* 状态卡片 */
        .status-card {
            margin: 10px 12px 0;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 8px 12px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 4px 0;
            font-size: 11px;
        }

        .status-label {
            color: rgba(255,255,255,0.5);
        }

        .status-val {
            font-weight: 600;
            color: #60a5fa;
        }

        .status-val.warning { color: #f0ad4e; }
        .status-val.success { color: #4ade80; }
        .status-val.danger  { color: #f87171; }

        .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 6px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        /* 配置区 */
        .config-section {
            margin: 10px 12px 0;
            background: rgba(255,255,255,0.04);
            border-radius: 8px;
            padding: 8px 12px;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .config-title {
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 5px 0;
        }

        .toggle-label {
            font-size: 12px;
            color: rgba(255,255,255,0.75);
        }

        /* 开关样式 */
        .toggle {
            position: relative;
            width: 34px;
            height: 18px;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.15);
            border-radius: 18px;
            transition: 0.2s;
        }

        .toggle-slider:before {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            left: 3px;
            bottom: 3px;
            background: #fff;
            border-radius: 50%;
            transition: 0.2s;
        }

        .toggle input:checked + .toggle-slider {
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
        }

        .toggle input:checked + .toggle-slider:before {
            transform: translateX(16px);
        }

        /* 快捷键提示 */
        .shortcuts {
            margin: 0 12px 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 6px;
            padding: 6px 10px;
        }

        .shortcuts-title {
            font-size: 10px;
            color: rgba(255,255,255,0.35);
            margin-bottom: 4px;
        }

        .shortcut-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .shortcut-item {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 10px;
            color: rgba(255,255,255,0.45);
        }

        .key {
            background: rgba(255,255,255,0.12);
            padding: 1px 5px;
            border-radius: 3px;
            font-family: monospace;
            font-size: 10px;
            color: rgba(255,255,255,0.7);
        }

        /* 底部 */
        .footer {
            text-align: center;
            padding: 8px 0;
            font-size: 10px;
            color: rgba(255,255,255,0.2);
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        /* 提示文字 */
        .hint {
            text-align: center;
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            padding: 4px 12px;
        }
    </style>
</head>
<body>
    <div class="header">
        <span class="icon">🎓</span>
        <span class="title">晖哥的助手</span>
        <span class="version">v2.2</span>
    </div>

    <!-- 状态卡片 -->
    <div class="status-card">
        <div class="status-row">
            <span class="status-label">状态</span>
            <span id="status-val" class="status-val">待机</span>
        </div>
        <div class="status-row">
            <span class="status-label">考试类型</span>
            <span id="exam-type-val" class="status-val warning">-</span>
        </div>
        <div class="status-row">
            <span class="status-label">题目数量</span>
            <span id="answers-count-val" class="status-val">-</span>
        </div>
        <div class="status-row">
            <span class="status-label">答题进度</span>
            <span id="progress-val" class="status-val">0/0</span>
        </div>
        <div class="progress-bar">
            <div id="progress-fill" class="progress-fill" style="width:0%"></div>
        </div>
    </div>

    <!-- 配置区 -->
    <div class="config-section">
        <div class="config-title">设置</div>
        <div class="toggle-row">
            <span class="toggle-label">启用插件</span>
            <label class="toggle">
                <input type="checkbox" id="toggle-enabled" checked>
                <span class="toggle-slider"></span>
            </label>
        </div>
        <div class="toggle-row">
            <span class="toggle-label">自动模式</span>
            <label class="toggle">
                <input type="checkbox" id="auto-mode">
                <span class="toggle-slider"></span>
            </label>
        </div>
        <div class="toggle-row">
            <span class="toggle-label">自动翻页 (局网)</span>
            <label class="toggle">
                <input type="checkbox" id="auto-nextpage">
                <span class="toggle-slider"></span>
            </label>
        </div>
    </div>

    <!-- 快捷键提示 -->
    <div class="shortcuts">
        <div class="shortcuts-title">页面快捷键</div>
        <div class="shortcut-list">
            <div class="shortcut-item"><span class="key">-</span> 获取源码</div>
            <div class="shortcut-item"><span class="key">+</span> 开始</div>
            <div class="shortcut-item"><span class="key">*</span> 面板</div>
            <div class="shortcut-item"><span class="key">/</span> 停止</div>
            <div class="shortcut-item"><span class="key">D</span> 调试</div>
            <div class="shortcut-item"><span class="key">H</span> 帮助</div>
        </div>
    </div>

    <div class="footer">晖哥的助手 · Chrome 插件版</div>

    <script src="popup.js"></script>
</body>
</html>
